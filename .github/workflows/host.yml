name: Host and Blender tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python tools/validate_scene.py examples/fixture.scene.json
      - run: python tools/package_addon.py
      - uses: actions/upload-artifact@v4
        with:
          name: blender-addon
          path: dist/libsaturn_toolkit.zip
  blender:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y blender
      - run: blender --version
      - run: blender --background --factory-startup --python-exit-code 1 --python tests/blender_smoke.py
